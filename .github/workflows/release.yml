# ============================================================================
# Automatic builds of static binaries for GitHub Releases.
#
# On pushing a tag like v1.0.0 (or running the workflow manually):
#   1. two fully static binaries are built:
#        iskra-linux-x86_64  — 64-bit (musl-tools toolchain from the distro);
#        iskra-linux-i686    — 32-bit (musl.cc toolchain, same as build-i686.sh);
#   2. the artifacts are attached to the GitHub Release of that tag
#      (release notes are generated from commits automatically).
# ============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, i686-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 64-bit: the musl linker from the Ubuntu repository.
      # 32-bit: the ready musl.cc cross-toolchain (GCC for i686-linux-musl).
      # musl.cc is a flaky single VPS — download the GitHub mirror of the same
      # tarball first (Actions reach github.com reliably), official site second.
      - name: Install musl toolchain
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update && sudo apt-get install -y musl-tools
          else
            mkdir -p "$HOME/musl-cross"
            curl -fsSL --retry 3 --retry-delay 5 -o "$HOME/i686-cross.tgz" \
              https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/i686-linux-musl-cross.tgz \
            || curl -fsSL --retry 3 --retry-delay 5 -o "$HOME/i686-cross.tgz" \
              https://musl.cc/i686-linux-musl-cross.tgz
            tar xzf "$HOME/i686-cross.tgz" -C "$HOME/musl-cross"
            rm -f "$HOME/i686-cross.tgz"
            test -x "$HOME/musl-cross/i686-linux-musl-cross/bin/i686-linux-musl-gcc"
            echo "MUSL_CROSS=$HOME/musl-cross/i686-linux-musl-cross" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          if [ -n "${MUSL_CROSS:-}" ]; then
            export CC_i686_unknown_linux_musl="$MUSL_CROSS/bin/i686-linux-musl-gcc"
            export AR_i686_unknown_linux_musl="$MUSL_CROSS/bin/i686-linux-musl-ar"
            export CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER="$MUSL_CROSS/bin/i686-linux-musl-gcc"
          fi
          cargo build --release --target ${{ matrix.target }}

      # Rename per architecture: two files named just "iskra" would clash
      # in a single release.
      - name: Prepare artifact
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) name="iskra-linux-x86_64" ;;
            i686-*)   name="iskra-linux-i686" ;;
            *)        name="iskra-${{ matrix.target }}" ;;
          esac
          cp "target/${{ matrix.target }}/release/iskra" "$name"
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: iskra-linux-*
          if-no-files-found: error

  release:
    name: attach to GitHub Release
    needs: build
    # A release is created only for tags; a manual run produces artifacts only.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
